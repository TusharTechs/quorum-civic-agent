<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 76" width="400" height="76" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="QUORUM — a council chamber arc with one seat filled, beside the wordmark QUORUM.">
<style>
  .arc  { fill: none; stroke: #16181d; stroke-width: 5.5; stroke-linecap: round; }
  .seat { fill: #1c4f8a; }
  .ring { fill: none; stroke: #f6f5f2; stroke-width: 3; }
  .floor{ stroke: #16181d; stroke-width: 5.5; stroke-linecap: round; opacity: .3; }
  .word { fill: #16181d; font-size: 31px; font-weight: 700; letter-spacing: 6px; }
  .tag  { fill: #5b6472; font-size: 11.5px; letter-spacing: 1.2px; }
  @media (prefers-color-scheme: dark) {
    .arc   { stroke: #e8e9ec; }
    .seat  { fill: #7fb0e8; }
    .ring  { stroke: #14161a; }
    .floor { stroke: #e8e9ec; }
    .word  { fill: #e8e9ec; }
    .tag   { fill: #99a2b0; }
  }
</style>
<g transform="translate(4,6)">
  <path class="arc" d="M10 42 A22 22 0 0 1 54 42"/>
  <path class="floor" d="M14 54 H50"/>
  <circle class="ring" cx="47.6" cy="26.4" r="10.5"/>
  <circle class="seat" cx="47.6" cy="26.4" r="8.5"/>
</g>
<text x="88" y="42" class="word">QUORUM</text>
<text x="90" y="61" class="tag">YOUR CITY HAS A MEMORY. NOW YOU DO TOO.</text>
</svg>
